[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scicalc-cli"
version = "1.0.0"
description = "A safe, zero-dependency scientific calculator for the terminal and the web."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yangxiaoran2014" }]
keywords = ["calculator", "scientific", "cli", "repl", "math", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Utilities",
]

[project.scripts]
scicalc = "scicalc.cli:main"

[project.urls]
Homepage = "https://yangxiaoran2014.github.io/scicalc/"
Repository = "https://github.com/yangxiaoran2014/scicalc"
Issues = "https://github.com/yangxiaoran2014/scicalc/issues"

[project.optional-dependencies]
dev = []

[tool.setuptools]
packages = ["scicalc"]
